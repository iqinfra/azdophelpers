<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex security review · TFVC C{{changeset}}</title>
<style id="report-style">
:root { color-scheme: light; --ink: #18243a; --muted: #51627a; --line: #dbe2ec; --paper: #ffffff; --wash: #f3f5f8; --soft: #f7f9fc; --blue: #245bb5; --critical: #9f2424; --critical-bg: #fff0ed; --warn: #785000; --warn-bg: #fff5d7; --pass: #146039; --pass-bg: #eaf8ef; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--wash); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { max-width: 1180px; margin: 40px auto; padding: 0 24px; }
header, section, article { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 28px; margin: 20px 0; }
h1 { font-size: clamp(1.8rem, 4vw, 2.35rem); line-height: 1.2; margin: 8px 0 16px; }
h2 { font-size: 1.45rem; line-height: 1.25; margin: 0 0 16px; }
h3 { font-size: 1.05rem; line-height: 1.35; margin: 18px 0 8px; }
p { margin: 10px 0; }
.eyebrow { color: var(--muted); font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.meta { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.badge { border-radius: 6px; display: inline-block; font-weight: 750; padding: 4px 12px; }
.critical, .high, .fail, .manual-review-required, .fallback { background: var(--critical-bg); color: var(--critical); }
.medium { background: var(--warn-bg); color: var(--warn); }
.low, .info, .pass, .complete { background: var(--pass-bg); color: var(--pass); }
.report-status { border: 1px solid currentColor; border-radius: 6px; display: inline-block; font-size: .8rem; font-weight: 700; margin-left: 8px; padding: 3px 9px; }
.fallback-banner { border-left: 4px solid var(--critical); background: var(--critical-bg); color: var(--critical); font-weight: 700; padding: 12px 16px; }
.metrics { display: grid; gap: 12px; grid-template-columns: repeat(6, minmax(90px, 1fr)); margin-top: 22px; }
.metric { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.metric span { color: var(--muted); display: block; font-size: .8rem; }
.metric strong { display: block; font-size: 1.7rem; line-height: 1.2; margin-top: 3px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; min-width: 700px; width: 100%; }
th, td { border-bottom: 1px solid var(--line); padding: 11px 10px; text-align: left; vertical-align: top; }
th { color: var(--muted); font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; }
tr:last-child td { border-bottom: 0; }
a { color: var(--blue); }
dl { display: grid; gap: 0; grid-template-columns: minmax(150px, 28%) 1fr; margin: 0; }
dt, dd { border-bottom: 1px solid var(--line); margin: 0; padding: 9px 0; }
dt { color: var(--muted); font-size: .9rem; font-weight: 700; padding-right: 20px; }
dd { overflow-wrap: anywhere; }
dl > dt:last-of-type, dl > dd:last-of-type { border-bottom: 0; }
.text, pre { overflow-wrap: anywhere; white-space: pre-wrap; }
pre { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; font: .9rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 8px 0; padding: 14px; }
.finding-title { margin-bottom: 2px; }
.finding-card { scroll-margin-top: 20px; }
.empty { color: var(--muted); font-style: italic; }
.list-plain { list-style: none; margin: 0; padding: 0; }
.list-plain li { border-bottom: 1px solid var(--line); padding: 9px 0; }
.list-plain li:last-child { border-bottom: 0; }
footer { color: var(--muted); font-size: .82rem; padding: 20px 0 12px; }
@media (max-width: 820px) { main { margin: 18px auto; padding: 0 12px; } header, section, article { border-radius: 8px; padding: 18px; } .metrics { grid-template-columns: repeat(3, minmax(80px, 1fr)); } dl { grid-template-columns: 1fr; } dt { border-bottom: 0; padding-bottom: 2px; } dd { padding-top: 2px; } }
@media (max-width: 460px) { .metrics { grid-template-columns: repeat(2, minmax(80px, 1fr)); } }
@media print { body { background: #fff; } main { max-width: none; margin: 0; padding: 0; } header, section, article { border-radius: 0; break-inside: avoid; margin: 0 0 14px; } .finding-card { break-inside: auto; } a { color: inherit; text-decoration: none; } .table-wrap { overflow: visible; } table { min-width: 0; } pre { white-space: pre-wrap; } }
</style>
</head>
<body>
<main id="report" data-report-kind="codex">
<header id="report-header"></header>
<section id="coverage"></section>
<section id="changed-files"></section>
<section id="summary"></section>
<section id="findings-overview"></section>
<section id="limitations"></section>
<section id="gate-policy"></section>
<section id="audit-metadata"></section>
<footer id="report-footer"></footer>
</main>
</body>
</html>
